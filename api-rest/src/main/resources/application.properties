spring.application.name=api-rest

# ─── Servidor ───────────────────────────────────────────────
server.port=8080

# ─── Base de datos MySQL ────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/chavez_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───────────────────────────────────────
# ddl-auto=validate: el esquema debe existir y coincidir exactamente.
# Spring Boot aplica CamelCaseToUnderscoresNamingStrategy por defecto,
# por lo que los campos camelCase de las entidades mapean a columnas snake_case:
#   costAvg    -> cost_avg
#   unitsBase  -> units_base
#   expiryDate -> expiry_date
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Inicialización del esquema ────────────────────────────
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=false

# ─── JWT ───────────────────────────────────────────────────
# Secreto en Base64 (48 bytes = 384 bits). Generar uno nuevo con:
#   openssl rand -base64 48
# En produccion inyectarlo por variable de entorno, nunca en el repositorio.
jwt.secret=${JWT_SECRET:b7+EAIWTTuwEAKppaqsHfk9Bt9yW2TlRMw5Jt3YVEDQZobnrRSLBrrVp6bR6SIDT}
jwt.expiration-ms=86400000

# ─── Logging ───────────────────────────────────────────────
logging.level.com.chavez.store=DEBUG

